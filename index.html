<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2f98ff">
<title>Sunny Shore Racer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: full-screen 3D beach track. Chunky rounded HUD in the corners,
   title and results as bright rounded cards. Single sunny look by design. */
:root{
  --ink:#ffffff; --deep:#0f3550; --sun:#ffc21f; --hot:#ff4a2a; --sea:#16c4d8; --card:rgba(255,255,255,.94); --cardInk:#123049; --muted:#5d7a90;
  --f-d:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif; --f-b:'Nunito',system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;color:var(--ink);font-family:var(--f-b);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.stroke{text-shadow:0 3px 0 var(--deep),0 0 2px var(--deep),2px 0 0 var(--deep),-2px 0 0 var(--deep),0 -2px 0 var(--deep)}
.layer{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.card{background:var(--card);color:var(--cardInk);border-radius:22px;padding:20px 22px;box-shadow:0 10px 0 rgba(15,53,80,.25),0 24px 60px rgba(15,53,80,.3);display:flex;flex-direction:column;gap:12px;width:100%;max-width:440px;max-height:100%;overflow:auto}
.logo{font-family:var(--f-d);font-size:clamp(46px,9vw,86px);line-height:.88;letter-spacing:.01em;color:#fff;transform:rotate(-3deg)}
.logo span{color:var(--sun)}
.tag{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:13px}
.btn{min-height:54px;border-radius:16px;font-family:var(--f-d);font-size:24px;letter-spacing:.03em;background:#e8f3fb;color:var(--cardInk);box-shadow:0 5px 0 #b9d3e6;display:flex;align-items:center;justify-content:center;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b9d3e6}
.btn.go{background:var(--hot);color:#fff;box-shadow:0 6px 0 #b8301a}
.row{display:flex;gap:10px}.row>*{flex:1}
.opt{display:grid;grid-template-columns:86px 1fr;align-items:center;gap:10px;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;background:#e8f3fb;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--cardInk);box-shadow:0 2px 0 #b9d3e6}
.chips{display:flex;gap:8px}.chip{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}.chip.on{outline:3px solid var(--cardInk);outline-offset:2px}
.best{font-family:var(--f-d);font-size:20px;color:var(--sun)}
.credit{font-size:12px;font-weight:800;opacity:.9}
.title-wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:center;max-width:920px;width:100%}
@media (max-width:640px){.title-wrap{grid-template-columns:1fr}}
.how{font-size:13px;color:var(--muted);line-height:1.45}

#hud{position:fixed;inset:0;z-index:5;pointer-events:none}
.tl,.tr{position:absolute;top:max(10px,env(safe-area-inset-top));display:flex;gap:8px;align-items:center}
.tl{left:max(14px,env(safe-area-inset-left))}.tr{right:max(14px,env(safe-area-inset-right))}
.chunk{background:rgba(15,53,80,.55);border-radius:14px;padding:6px 12px;font-family:var(--f-d);font-size:24px;display:flex;align-items:center;gap:8px}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a8,#ffcf3a 45%,#d99a12);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.ib{pointer-events:auto;width:46px;height:46px;border-radius:14px;background:rgba(15,53,80,.55);display:grid;place-items:center}
.ib svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round}
.speedo{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));text-align:right;font-family:var(--f-d)}
.speedo .v{font-size:clamp(44px,9vh,72px);line-height:.9}
.speedo .k{font-size:15px;letter-spacing:.1em}
.nitro{position:absolute;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:auto}
.nitro button{width:104px;height:56px;border-radius:18px;font-family:var(--f-d);font-size:22px;background:#2fa8ff;color:#fff;box-shadow:0 5px 0 #1a6fb0}
.nitro button.on{transform:translateY(3px);box-shadow:0 2px 0 #1a6fb0;background:#4fd0ff}
.nbar{width:150px;height:9px;border-radius:5px;background:rgba(15,53,80,.5);overflow:hidden}
.nbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fd0ff,#ffffff)}
#pop{position:absolute;left:50%;top:28%;transform:translate(-50%,-50%) rotate(-3deg);font-family:var(--f-d);font-size:clamp(28px,6vw,52px);color:var(--sun);opacity:0;transition:opacity .2s;white-space:nowrap}
#count{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-family:var(--f-d);font-size:clamp(70px,16vw,150px);color:#fff}
.hint{position:absolute;bottom:max(86px,calc(env(safe-area-inset-bottom) + 86px));left:50%;transform:translateX(-50%);font-weight:800;font-size:13px;background:rgba(15,53,80,.55);padding:6px 12px;border-radius:10px;white-space:nowrap;transition:opacity .6s}
.zones{position:absolute;inset:0;display:flex;pointer-events:auto}.zones div{flex:1}
#rotate{position:fixed;inset:0;z-index:50;background:#2f98ff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;font-family:var(--f-d);font-size:30px}
#rotate svg{width:72px;height:72px;stroke:#fff;fill:none;stroke-width:2.5;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#e8f3fb;border-radius:12px;padding:8px;text-align:center}
.stat .k{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--f-d);font-size:22px}
@media (prefers-reduced-motion:reduce){#rotate svg{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="rotate"><svg viewBox="0 0 48 48"><rect x="14" y="6" width="20" height="36" rx="4"/><path d="M21 37h6"/></svg>Turn your phone sideways</div>

<div id="hud" hidden>
  <div class="zones" id="zones"><div id="zl"></div><div id="zr"></div></div>
  <div class="tl"><div class="chunk stroke"><span id="hDist">0</span>m</div><div class="chunk stroke"><span class="coin"></span><span id="hCoins">0</span></div></div>
  <div class="tr">
    <button class="ib" id="bSnd" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></button>
    <button class="ib" id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
  </div>
  <div id="pop" class="stroke"></div>
  <div id="count" class="stroke" hidden></div>
  <div class="hint" id="hint"></div>
  <div class="nitro"><button id="bNitro">NITRO</button><div class="nbar"><i id="hNitro"></i></div></div>
  <div class="speedo stroke"><div class="v" id="hSpd">0</div><div class="k">KM/H</div></div>
</div>

<div class="layer" id="scrTitle">
  <div class="title-wrap">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="tag stroke">Endless beach buggy racing</div>
      <div class="logo stroke">Sunny Shore<br><span>Racer</span></div>
      <div class="best stroke" id="tBest">Best 0</div>
      <div class="credit stroke">A game by Obi Promise · CSC 131</div>
    </div>
    <div class="card">
      <button class="btn go" id="bPlay">Race!</button>
      <div class="opt"><span>Steering</span><div class="seg" id="sCtl"><button data-v="tilt">Tilt</button><button data-v="touch">Tap sides</button></div></div>
      <div class="opt"><span>Buggy</span><div class="chips" id="sPaint"></div></div>
      <div class="opt"><span>Graphics</span><div class="seg" id="sQ"><button data-v="high">Pretty</button><button data-v="low">Fast</button></div></div>
      <div class="how" id="how"></div>
    </div>
  </div>
</div>
<div class="layer" id="scrPause" hidden><div class="card" style="max-width:340px">
  <div class="logo" style="font-size:44px;color:var(--cardInk);transform:none">Paused</div>
  <button class="btn go" id="pResume">Resume</button><button class="btn" id="pRecal">Re-centre tilt</button><button class="btn" id="pMenu">Menu</button></div></div>
<div class="layer" id="scrOver" hidden><div class="card" style="max-width:520px">
  <div class="tag" id="oSub" style="color:var(--hot)">Wipeout!</div>
  <div class="logo" id="oScore" style="font-size:48px;color:var(--cardInk);transform:none">0</div>
  <div class="stats">
    <div class="stat"><div class="k">Distance</div><div class="v" id="oDist">0</div></div>
    <div class="stat"><div class="k">Coins</div><div class="v" id="oCoins">0</div></div>
    <div class="stat"><div class="k">Air time</div><div class="v" id="oAir">0</div></div>
    <div class="stat"><div class="k">Best</div><div class="v" id="oBest">0</div></div>
  </div>
  <div class="row"><button class="btn" id="oMenu">Menu</button><button class="btn go" id="oAgain">Again!</button></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
(() => {
'use strict';
/* SUNNY SHORE RACER - endless beach buggy racer. A game by Obi Promise (CSC 131).
   The buggy stays at z = 0 and the beach scrolls toward the camera. A vertex-shader
   "bend" curves the whole world (left/right and over the horizon) so the road winds.
   Props are merged into single meshes and drawn instanced: a few draw calls total.
   1 setup · 2 bend + materials · 3 geometry kit · 4 world · 5 buggies · 6 entities
   7 input · 8 audio · 9 game loop, cut scenes, HUD */
const $ = s => document.querySelector(s);
const PI = Math.PI, R2 = PI / 2, clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t, rnd = (a, b) => a + Math.random() * (b - a);
const store = { get(k, d) { try { const v = localStorage.getItem('ssr_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('ssr_' + k, JSON.stringify(v)); } catch (e) {} } };
const touch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const PAINTS = [0xff4a2a, 0x2f7bff, 0xffc21f, 0x22c37a, 0x9b5cff];
const cfg = Object.assign({ ctl: touch ? 'tilt' : 'touch', paint: 0, q: touch ? 'low' : 'high', snd: true }, store.get('cfg', {}));
const saveCfg = () => store.set('cfg', cfg);
const HIGH = cfg.q === 'high';

/* ---------- 1. renderer ---------- */
const renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias: true, powerPreference: 'high-performance' });
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = HIGH ? THREE.PCFSoftShadowMap : THREE.PCFShadowMap;
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(58, 1, 0.1, 700);
function resize() { renderer.setPixelRatio(Math.min(devicePixelRatio || 1, HIGH ? 1.5 : 1)); renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);
const lin = h => new THREE.Color(h).convertSRGBToLinear();
const cv = (w, h, f) => { const c = document.createElement('canvas'); c.width = w; c.height = h; f(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy()); return t; };
const SKY = ['#2f98ff', '#c4ecff'];
scene.background = cv(4, 512, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, SKY[0]); gr.addColorStop(0.62, SKY[1]); gr.addColorStop(1, '#e8f7ff'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
scene.fog = new THREE.Fog(lin('#d6f0ff'), 110, 330);
scene.environment = new THREE.PMREMGenerator(renderer).fromEquirectangular((() => { const t = cv(256, 128, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, SKY[0]); gr.addColorStop(0.5, '#ffffff'); gr.addColorStop(0.56, '#efc982'); gr.addColorStop(1, '#c89a5a'); g.fillStyle = gr; g.fillRect(0, 0, w, h); }); t.mapping = THREE.EquirectangularReflectionMapping; return t; })()).texture;
scene.add(new THREE.HemisphereLight(lin('#cdeeff'), lin('#d9b070'), 0.55));
const sun = new THREE.DirectionalLight(0xfff1dd, 2.3); sun.castShadow = true; sun.shadow.mapSize.set(HIGH ? 2048 : 1024, HIGH ? 2048 : 1024);
Object.assign(sun.shadow.camera, { left: -24, right: 24, top: 30, bottom: -30, near: 1, far: 120 }); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.04;
sun.position.set(-22, 38, 14); sun.target.position.set(0, 0, -12); scene.add(sun, sun.target);

/* ---------- 2. the world bend + materials ---------- */
const BEND = { value: new THREE.Vector2(0, -0.0012) };
function bend(m) {
  m.onBeforeCompile = sh => { sh.uniforms.uBend = BEND;
    sh.vertexShader = 'uniform vec2 uBend;\n' + sh.vertexShader.replace('#include <project_vertex>', '#include <project_vertex>\n mvPosition.xy += uBend * (mvPosition.z * mvPosition.z);\n gl_Position = projectionMatrix * mvPosition;'); };
  return m;
}
const mat = (h, o = {}) => bend(new THREE.MeshStandardMaterial(Object.assign({ color: lin(h), roughness: 0.75 }, o)));
const VCOL = bend(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.62, side: THREE.DoubleSide }));
const VGLOSS = bend(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.25, metalness: 0.15 }));

/* ---------- 3. geometry kit: build props from simple parts, bake colours, merge ---------- */
function part(geo, color, pos = [0, 0, 0], rot = [0, 0, 0], scl = [1, 1, 1]) {
  const g = geo.index ? geo.toNonIndexed() : geo.clone();
  g.applyMatrix4(new THREE.Matrix4().compose(new THREE.Vector3(...pos), new THREE.Quaternion().setFromEuler(new THREE.Euler(...rot)), new THREE.Vector3(...scl)));
  const c = lin(color), n = g.attributes.position.count, a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(a, 3));
  if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n * 2), 2));
  for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv', 'color'].includes(k)) g.deleteAttribute(k);
  return g;
}
const merge = parts => THREE.BufferGeometryUtils.mergeBufferGeometries(parts);
const leafGeo = (() => { const g = new THREE.PlaneGeometry(1.1, 4.2, 2, 8), p = g.attributes.position; for (let i = 0; i < p.count; i++) { const y = p.getY(i) + 2.1, t = y / 4.2; p.setX(i, p.getX(i) * Math.sin(t * PI) * 1.2); p.setZ(i, -t * t * 2.2 + Math.abs(p.getX(i)) * 0.5); p.setY(i, y); } g.rotateX(-R2 * 0.9); g.computeVertexNormals(); return g; })();
const noisyBall = (d = 2) => { const g = new THREE.IcosahedronGeometry(1, d), p = g.attributes.position, v = new THREE.Vector3(); for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); v.multiplyScalar(1 + 0.16 * Math.sin(v.x * 3.1) * Math.cos(v.y * 2.7) + 0.07 * Math.sin(v.z * 5)); p.setXYZ(i, v.x, v.y, v.z); } g.computeVertexNormals(); return g; };
const roundBox = (w, h, d, r) => { const s = new THREE.Shape(); s.moveTo(-w / 2 + r, 0); s.lineTo(w / 2 - r, 0); s.quadraticCurveTo(w / 2, 0, w / 2, r); s.lineTo(w / 2, h - r); s.quadraticCurveTo(w / 2, h, w / 2 - r, h); s.lineTo(-w / 2 + r, h); s.quadraticCurveTo(-w / 2, h, -w / 2, h - r); s.lineTo(-w / 2, r); s.quadraticCurveTo(-w / 2, 0, -w / 2 + r, 0);
  const g = new THREE.ExtrudeGeometry(s, { depth: d - 2 * r * 0.7, bevelEnabled: true, bevelThickness: r * 0.7, bevelSize: r * 0.4, bevelSegments: 3, curveSegments: 6 }); g.translate(0, 0, -(d - 2 * r * 0.7) / 2); return g; };
const KIT = {};
KIT.palm = (() => { const P = [], lean = 0.2; let px = 0, py = 0; const h = 8;
  for (let i = 0; i < 9; i++) { px += lean * 0.12 * i; P.push(part(new THREE.CylinderGeometry(0.25 - i * 0.012, 0.3 - i * 0.012, h / 9 * 1.06, 10), i % 2 ? '#9a6a3c' : '#87582f', [px, py + h / 18, 0], [0, 0, -lean * 0.12 * i])); py += h / 9; }
  for (let k = 0; k < 8; k++) P.push(part(leafGeo, k % 2 ? '#32b44c' : '#3fc75a', [px, py, 0], [0, k / 8 * PI * 2 + 0.2, 0]));
  for (let k = 0; k < 3; k++) P.push(part(new THREE.SphereGeometry(0.22, 10, 8), '#6e4220', [px + Math.cos(k * 2) * 0.3, py - 0.25, Math.sin(k * 2) * 0.3]));
  return merge(P); })();
KIT.hut = merge([part(new THREE.CylinderGeometry(2.2, 2.3, 2.6, 22), '#b77b45', [0, 1.3, 0]), part(new THREE.ConeGeometry(3.4, 2.6, 22, 3), '#e8c46a', [0, 3.6, 0]), part(new THREE.ConeGeometry(0.6, 0.7, 12), '#c99a3e', [0, 5.1, 0]),
  part(new THREE.BoxGeometry(1, 1.8, 0.2), '#6a4426', [0, 0.9, 2.2]), part(new THREE.BoxGeometry(0.9, 0.7, 0.15), '#5fd0ff', [1.4, 1.5, 1.7], [0, 0.6, 0]), part(new THREE.CylinderGeometry(0.1, 0.1, 1.2, 8), '#ffffff', [-2.6, 0.6, 1.2])]);
KIT.umbrella = (() => { const P = [part(new THREE.CylinderGeometry(0.06, 0.06, 2.7, 8), '#ffffff', [0, 1.35, 0])];
  for (let k = 0; k < 8; k++) P.push(part(new THREE.ConeGeometry(1.9, 0.8, 3, 1, true, k * PI / 4, PI / 4), k % 2 ? '#ffffff' : '#ff4a6a', [0, 2.75, 0]));
  P.push(part(new THREE.BoxGeometry(1.1, 0.04, 2.1), '#4fc3ff', [1.0, 0.03, 0.5])); P.push(part(new THREE.SphereGeometry(0.35, 14, 10), '#ffd24a', [-1.0, 0.35, 0.8])); return merge(P); })();
KIT.rock = merge([part(noisyBall(2), '#cbb28c', [0, 0.35, 0])]);
KIT.tires = merge([0, 1, 2].map(k => part(new THREE.TorusGeometry(0.45, 0.22, 12, 22), k === 1 ? '#f4f4f4' : '#1c1c1f', [0, 0.22 + k * 0.42, 0], [R2, 0, 0])));
KIT.boat = merge([part(new THREE.SphereGeometry(1, 20, 10, 0, PI * 2, 0, R2), '#ffffff', [0, 0.6, 0], [PI, 0, 0], [1.4, 0.8, 4]), part(new THREE.CylinderGeometry(0.06, 0.06, 5, 6), '#8a5a34', [0, 3.1, 0]),
  part(new THREE.ConeGeometry(1.6, 4.6, 3), '#ff5a3c', [0.4, 3.4, 0], [0, 0, 0], [1, 1, 0.12]), part(new THREE.TorusGeometry(1.42, 0.08, 6, 30), '#2f7bff', [0, 0.6, 0], [R2, 0, 0], [1, 2.8, 1])]);
KIT.dune = merge([part(new THREE.SphereGeometry(1, 24, 12, 0, PI * 2, 0, R2), '#efc982')]);
KIT.cloud = merge([0, 1, 2, 3, 4].map(k => part(new THREE.SphereGeometry(1, 16, 12), '#ffffff', [k * 1.3 - 2.6, Math.sin(k * 1.7) * 0.3, Math.cos(k * 2.3) * 0.4], [0, 0, 0], [1 + (k % 2) * 0.4, 0.8 + (k % 3) * 0.2, 1])));
